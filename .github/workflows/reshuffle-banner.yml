name: Reshuffle Bytebug banner

# Every day, rebuild assets/banner.svg with new Bytebug pairs, timings and emotions.
on:
  schedule:
    - cron: "0 0 * * *"   # 00:00 UTC = 8:00 AM in the Philippines
  workflow_dispatch:      # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  reshuffle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build a new random banner
        run: python banner/build_banner.py

      - name: Commit the new banner
        run: |
          if git diff --quiet -- assets/banner.svg; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/banner.svg
          git commit -m "Reshuffle Bytebug banner"
          git push
